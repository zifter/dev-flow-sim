<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Процесс разработки</title>
<meta name="description" content="Визуализация workflow: команда из людей и агентов, этапы и задачи разных типов">
<style>
/* Layout: сверху схема процесса на всю ширину, под ней редактор: команда и роли, этапы, типы задач */
/* Стиль для проектора: чёрный фон, белый текст, серые линии и один акцент — красный, только для узкого места
   и главной цифры. Шрифт — из системы: начертания объявлены по отдельности через local(), файлов шрифта в репо нет. */
@font-face { font-family: "UI Sans"; font-weight: 300; src: local("Suisse Int'l Light"), local("Suisse Intl Light"), local("SuisseIntl-Light"), local("Helvetica Neue Light"), local("HelveticaNeue-Light"); }
@font-face { font-family: "UI Sans"; font-weight: 400; src: local("Suisse Int'l Regular"), local("Suisse Intl Regular"), local("SuisseIntl-Regular"), local("Helvetica Neue"), local("HelveticaNeue"); }
@font-face { font-family: "UI Sans"; font-weight: 700; src: local("Suisse Int'l Bold"), local("Suisse Intl Bold"), local("SuisseIntl-Bold"), local("Helvetica Neue Bold"), local("HelveticaNeue-Bold"); }
:root {
  --bg: #000000; --surface: #1d1d1d; --surface-2: #2a2a2a;
  --ink: #ffffff; --ink-2: #c8c8c8; --muted: #9e9e9e;
  --grid: #3a3a3a; --axis: #8a8a8a; --line: #5a5a5a;
  --accent: #ffffff;
  /* Роли — светлые серые разной светлоты, текст на них чёрный */
  --s1: #ffffff; --s2: #cfcfcf; --s3: #a6a6a6; --s4: #8c8c8c;
  --s5: #e6e6e6; --s6: #b8b8b8; --s7: #999999; --s8: #808080;
  --agent: #3d3d3d; --assist: #ffffff;
  --day: #ffffff;
  --k1: #6fb6ff; --k2: #ffb35c; --k3: #8fd18a; --k4: #d9a6ff;
  --hot: #ff1e46; --warm: #ffffff; --ok: #b0b0b0; --cold: #7a7a7a;
  /* Рамка карточки — откуда задача: стори от PM — золото, баг от QA — красный, техдолг от разработки — фиолетовый */
  --b-story: #ffcc33; --b-bug: #ff1e46; --b-debt: #b388ff;
  --neutral: #c8c8c8; /* заливка карточек, когда специализации нет: домены ничего не значат */
  --f-display: "UI Sans", "Suisse Intl", "Suisse Int'l", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-body: var(--f-display);
  --f-mono: var(--f-display);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg) radial-gradient(circle, #2e2e2e 3px, transparent 3.5px) 0 0 / 32px 32px; color: var(--ink); font: 14px/1.5 var(--f-body);
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
h1, h2 { text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
input[type=checkbox], input[type=radio] { accent-color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, input[type=number] { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.page { max-width: 1440px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 16px; display: grid; gap: 14px; min-width: 0; grid-template-columns: minmax(0, 1fr); align-content: start; }
.panel h2 { font: 400 12px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: 2px; color: var(--ink-2); }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.btns { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 2px; padding: 5px 10px; cursor: pointer; font-size: 13px; text-decoration: none; color: inherit; }
.btn:hover { border-color: var(--axis); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 96px; }
.btn.ghost { background: transparent; }
.icon-btn { border: 0; background: transparent; cursor: pointer; padding: 2px 6px; border-radius: 4px; color: var(--ink-2); font-size: 14px; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn:disabled { opacity: 0.3; cursor: default; background: transparent; }
input[type=text], input[type=number], select { background: var(--bg); border: 1px solid var(--line); border-radius: 2px; padding: 5px 7px; width: 100%; min-width: 0; }
.bar select { width: auto; }
.clock { font: 600 13px var(--f-mono); }
.clock-sub { font-size: 12.5px; color: var(--ink-2); min-height: 1.5em; }
.clock-sub .num { color: var(--ink); font-weight: 600; }
.time { display: inline-flex; align-items: center; gap: 8px; }
.dial { flex: none; display: block; }
.dial .face { fill: var(--surface-2); }
.dial .track { fill: none; stroke: var(--grid); stroke-width: 7; }
.dial .day { fill: none; stroke: var(--day); stroke-width: 7; }
.dial .work-a { fill: none; stroke: var(--ink-2); stroke-width: 2; }
/* Ширина блока постоянная: меняющийся текст не двигает кнопки рядом. */
.time-txt { display: grid; gap: 2px; width: 340px; max-width: 100%; }
.time-txt > .clock, .time-txt > .clock-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Календарь недели: сегодня — синим, прошедшие дни бледнее, выходные людей — пунктиром */
.week { display: flex; align-items: center; gap: 3px; margin: 2px 0; }
.week i { font: 600 11px/18px var(--f-body); font-style: normal; width: 27px; text-align: center; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.week i.rest { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--axis); }
.week i.past { opacity: 0.7; }
.week i.today { background: var(--accent); color: #000; box-shadow: none; opacity: 1; }
.mix { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.mix:empty { display: none; }
.mix .mb { display: flex; width: 120px; height: 6px; border-radius: 1px; overflow: hidden; background: var(--grid); }
.mix .mb i { display: block; height: 100%; }
.week small { margin-left: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.legend .lg-d { background: var(--day); }
.dial .day.off, .dial .work-a.off { opacity: 0.45; }

/* Story Points за спринт */
.vel { display: grid; gap: 16px 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .vel { grid-template-columns: 280px minmax(0, 1fr); } }
.vel-stats { display: grid; gap: 14px; align-content: start; }
.stat { display: grid; gap: 2px; }
.stat > span { font-size: 11px; color: var(--ink-2); }
.stat b { font: 300 28px/1.1 var(--f-mono); }
.stat b small { font: 400 12px var(--f-body); color: var(--ink-2); margin-left: 4px; }
.stat > small { font-size: 12px; color: var(--ink-2); }
.stat > span { text-transform: uppercase; letter-spacing: 2px; }
/* Главная цифра — расчёт: крупно и с красной полосой сверху */
.stat.main b { font-size: 36px; }
.stat .was { color: var(--ink-2); }
.stat .bugs { color: var(--hot); }
.vel-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.vel-chart .ax text { fill: var(--muted); font: 10px var(--f-mono); }
.vel-chart .ax line { stroke: var(--grid); }
.vel-chart .bar { fill: var(--s3); }
.vel-chart .bar.cur { fill: var(--s3); fill-opacity: 0.3; stroke: var(--s3); stroke-dasharray: 3 2; }
.vel-chart .bar-v { font: 600 10px var(--f-mono); fill: var(--ink-2); }
.vel-chart .est { fill: none; stroke: var(--ink); stroke-width: 2; }
.vel-chart .est-d { fill: var(--ink); }
.vel-chart .fc { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 4; }
.vel-chart .fc-t { fill: var(--accent); font: 600 10px var(--f-mono); }
.vel-chart .was { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 3; }
.vel-chart .was-t { fill: var(--muted); font: 10px var(--f-mono); }
.vel-chart .chg { stroke: var(--warm); stroke-width: 1.5; stroke-dasharray: 3 3; }
.vel-legend .l-chg { height: 10px; width: 0; border-left: 2px dashed var(--warm); vertical-align: -1px; }
.vel-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.vel-legend i { display: inline-block; width: 14px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.vel-legend .l-bar { background: var(--s3); border-radius: 2px; }
.vel-legend .l-est { height: 2px; background: var(--ink); vertical-align: 3px; }
.vel-legend .l-fc { height: 0; border-top: 2px dashed var(--accent); vertical-align: 3px; }
.vel-legend .l-was { height: 0; border-top: 2px dotted var(--muted); vertical-align: 3px; }
.legend .lg-a { background: var(--agent); }
.dial .tk { stroke: var(--axis); stroke-width: 1; }
.dial .tk.mj { stroke: var(--ink-2); stroke-width: 1.5; }
.dial text { font: 600 5.6px var(--f-mono); fill: var(--ink-2); letter-spacing: -0.3px; }
.dial .hand { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
.dial .hub { fill: var(--ink); }

/* Схема */
.flow-scroll { overflow-x: auto; padding-bottom: 2px; }
.flow svg { width: 100%; height: auto; display: block; }
.flow .n-box { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.flow .queue .n-box { fill: transparent; stroke: var(--axis); stroke-dasharray: 5 4; }
.flow .term .n-box { fill: var(--surface-2); stroke: none; }
.flow .st { cursor: pointer; }
.flow .st:hover .n-box, .flow .st:focus-visible .n-box { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: none; }
.flow .node:focus-visible, .flow .ins:focus-visible { outline: none; }
.flow .n-name { font: 600 13px var(--f-body); fill: var(--ink); }
.flow .n-sub { font: 11px var(--f-body); fill: var(--ink-2); }
.flow .n-cnt { font: 11.5px var(--f-body); fill: var(--ink-2); }
.flow .n-cnt .num { fill: var(--ink); font-weight: 600; }
.flow .n-big { font: 600 26px var(--f-mono); fill: var(--ink); }
.flow .av { font: 700 9px var(--f-body); fill: #000; }
.flow .av.ag { fill: #fff; }
.flow .chip-t { font: 700 10px var(--f-mono); fill: #000; }
.flow .chip-w { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1; }
.flow .chip-wt { font: 600 10px var(--f-mono); fill: var(--ink); }
.flow .chip-d { fill: transparent; stroke: var(--axis); stroke-width: 1; }
.flow .chip-dt { font: 10px var(--f-mono); fill: var(--muted); }
.flow .more { font: 600 10px var(--f-mono); fill: var(--ink-2); }
.flow .pg-bg { fill: var(--grid); }
.flow .off { opacity: 0.7; }
.flow .e-base { fill: none; stroke: var(--axis); stroke-width: 2; }
.flow .e-head { fill: var(--axis); }
.flow .e-hot { opacity: 0; pointer-events: none; }
.flow .e-hot .e-line { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
.flow .e-hot .e-tip { fill: var(--accent); }
.flow .ins { cursor: pointer; opacity: 0.6; }
.flow .ins circle { fill: var(--surface); stroke: var(--axis); }
.flow .ins path { stroke: var(--ink-2); stroke-width: 1.6; stroke-linecap: round; }
.flow .ins:hover, .flow .ins:focus-visible { opacity: 1; }
.flow .ins:hover circle, .flow .ins:focus-visible circle { stroke: var(--accent); stroke-width: 1.5; }
.flow .fly { pointer-events: none; }
/* Баги от QA: пунктирная дуга от этапа тестирования к бэклогу */
.flow .bug .e-base { stroke: var(--ink-2); stroke-dasharray: 4 3; opacity: 0.75; }
.flow .bug .e-head { fill: var(--ink-2); opacity: 0.75; }
.flow .bug .e-hot .e-line { stroke: var(--ink); }
.flow .bug .e-hot .e-tip { fill: var(--ink); }
.flow .bug-lbl { font: 400 11px var(--f-body); fill: var(--ink-2); }
.flow .skip .e-base { stroke: var(--ink); stroke-dasharray: 2 3; }
.flow .skip .e-head { fill: var(--ink); }
.flow .skip-lbl { font: 400 11px var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.flow .fresh { animation: pop 0.6s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(0.85); } }

/* Загрузка: узкое место, близко к пределу, норма, недогрузка */
.lv-hot { --lv: var(--hot); } .lv-warm { --lv: var(--warm); } .lv-ok { --lv: var(--ok); } .lv-cold { --lv: var(--cold); }
.flow .st.lv-hot .n-box { stroke: var(--hot); stroke-width: 2.5; }
.flow .st.lv-warm .n-box { stroke: var(--warm); stroke-width: 1.5; }
.flow .st.lv-cold .n-box { stroke: var(--cold); stroke-width: 1.5; stroke-dasharray: 5 3; }
.flow .ld-pill { fill: var(--lv); }
.flow .ld-t { font: 700 10px var(--f-mono); fill: #000; }
.ld { display: inline-block; font: 700 11px/16px var(--f-mono); color: #000; background: var(--lv); border-radius: 2px; padding: 0 6px; }
.ld.na { background: var(--grid); color: var(--muted); }
.load-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.load-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--lv); }
.loads { display: grid; gap: 6px; margin-top: 4px; }
.loads .lh { font-size: 12px; color: var(--ink-2); }
.load-row { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 2px 8px; align-items: center; font-size: 12.5px; }
.load-row .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.load-row .bar span { display: block; height: 100%; background: var(--lv); border-radius: 3px; }
.load-row .ld { justify-self: end; }
.load-row small { color: var(--muted); }
.type-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.type-legend i { display: inline-block; min-width: 30px; padding: 0 4px; margin-right: 5px; border-radius: 2px; color: #000; font: 700 10px/15px var(--f-mono); font-style: normal; text-align: center; }
.type-legend i.fr { background: transparent; color: var(--ink); }
.dom-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.dom-legend i { display: inline-block; width: 14px; height: 10px; border: 2px solid; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.idle { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; font-size: 13px; color: var(--ink-2); }
.idle b { grid-column: 1 / -1; font-weight: 500; color: var(--ink); }
/* Карточка участника фиксированного размера: меняющийся статус не двигает соседей */
.person { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; grid-template-areas: "av pn ld" "av ps pd"; gap: 0 8px; align-items: center;
  padding: 6px 8px; border: 1px solid var(--line); border-radius: 2px; background: var(--bg); min-width: 0; }
.person > .av-h { grid-area: av; } .person > .pn { grid-area: pn; } .person > .ld { grid-area: ld; justify-self: end; }
.person > .ps { grid-area: ps; } .person > .pd { grid-area: pd; justify-self: end; }
.person > .pn, .person > .ps { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person small { color: var(--muted); font-size: 12px; }
.person .pd { font-variant-numeric: tabular-nums; }
.person .ld { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.person.busy .pn { color: var(--ink); }
.person.busy .ps { color: var(--ink-2); }
.person.off .av-h { opacity: 0.7; }
.av-h { display: inline-block; width: 22px; height: 22px; border-radius: 50%; color: #000; font: 700 9px/22px var(--f-body); text-align: center; flex: none; }
/* Человек с ИИ-ассистентом — фиолетовое кольцо цвета агентов */
.av-h.ag { color: #fff; }
.av-h.assist { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--assist); }
.m-row > .sp label { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; font-size: 12px; }
.m-row > .sp label input { margin: 0; accent-color: var(--ink); }

/* Редактор */
.edit { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 980px) { .edit { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); } }
.edit .wide { grid-column: 1 / -1; }
.rows { display: grid; gap: 6px; }
.rows .head { font-size: 12px; color: var(--muted); }
.sw { width: 10px; height: 10px; border-radius: 3px; }
.settings { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.field { display: grid; gap: 3px; }
.field > span { font-size: 12px; color: var(--ink-2); }

.m-row { display: grid; gap: 6px; align-items: center;
  grid-template-columns: 14px 22px 24px minmax(0, 1.2fr) minmax(0, 1fr) 104px minmax(0, 1fr) 88px 92px 30px;
  grid-template-areas: "gr on av name role kind sk sp rt del"; }
.m-row > .grip { grid-area: gr; }
.m-row > .rt { grid-area: rt; display: flex; align-items: center; gap: 3px; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.m-row > .rt input { min-width: 0; }
.m-row > .on { grid-area: on; display: flex; justify-content: center; }
.m-row > .on input { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }
/* Отключённый участник: строка бледнеет, переключатель остаётся ярким */
.m-row.inactive > :not(.on) { opacity: 0.45; }
.m-row.inactive .nm { text-decoration: line-through; }
.m-row > .sk { grid-area: sk; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; color: var(--ink-2); }
.m-row > .sk label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.m-row > .sk input { margin: 0; }
.m-row > .sk .all { font-weight: 500; color: var(--ink); }
.m-row > .sk input:disabled + .dom-dot, .m-row > .sk label:has(input:disabled) { opacity: 0.55; }
.m-row > .sk small { color: var(--muted); font-size: 12px; }
.dom-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
.m-row > .av-h { grid-area: av; } .m-row > .nm { grid-area: name; } .m-row > .rl { grid-area: role; }
.m-row > .kd { grid-area: kind; } .m-row > .sp { grid-area: sp; display: flex; align-items: center; gap: 4px; color: var(--ink-2); } .m-row > .del { grid-area: del; }
@media (max-width: 560px) {
  .m-row { grid-template-columns: 14px 22px 24px minmax(0, 1fr) 96px 30px; grid-template-areas: "gr on av name name del" ". . . role kind kind" ". . . sk sk sk" ". . . sp rt rt"; padding-bottom: 6px; border-bottom: 1px solid var(--grid); }
  .m-row.head { display: none; }
}

.r-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 30px; gap: 8px; align-items: center; }
#roles .r-row { grid-template-columns: 10px minmax(0, 1fr) 112px auto 30px; grid-template-areas: "sw nm rt who del" ". cr cr cr ."; row-gap: 4px; }
#roles .r-row > .sw { grid-area: sw; } #roles .r-row > [data-k="name"] { grid-area: nm; } #roles .r-row > .r-rate { grid-area: rt; }
#roles .r-row > small { grid-area: who; } #roles .r-row > .icon-btn { grid-area: del; } #roles .r-row > .cr { grid-area: cr; }
/* Какие типы задач заводит роль: раскрывающийся список с галочками */
.cr { font-size: 12.5px; color: var(--ink-2); }
.cr summary { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr summary b { font-weight: 500; color: var(--ink); }
.cr-list { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 0 2px; }
.cr-list label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.cr-list label.all { font-weight: 500; color: var(--ink); }
.cr-list input { margin: 0; }
.cr-list i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }

.s-row { display: grid; gap: 6px; align-items: center; border-radius: 2px;
  grid-template-columns: 16px 10px minmax(0, 1.3fr) minmax(0, 1.1fr) 104px auto;
  grid-template-areas: "gr sw name role num act"; }
.s-row > .grip { grid-area: gr; } .s-row > .sw { grid-area: sw; } .s-row > .nm { grid-area: name; } .s-row > select { grid-area: role; }

@media (max-width: 560px) {
  .s-row { grid-template-columns: 16px 10px minmax(0, 1fr) 96px; grid-template-areas: "gr sw name act" ". . role num"; padding-bottom: 6px; border-bottom: 1px solid var(--grid); }
  .s-row.head { display: none; }
}
.flash { animation: flash 1.4s ease-out; }
/* Перетаскивание строк этапов и типов */
.grip { cursor: grab; color: var(--muted); user-select: none; font-size: 15px; line-height: 1; text-align: center; padding: 2px 0; }
.grip:hover { color: var(--ink); }
.grip:active { cursor: grabbing; }
.dragging { opacity: 0.4; }
.s-row.drop-before { box-shadow: 0 -2px 0 var(--accent); }
.s-row.drop-after { box-shadow: 0 2px 0 var(--accent); }
tr.drop-before td { box-shadow: inset 0 2px 0 var(--accent); }
tr.drop-after td { box-shadow: inset 0 -2px 0 var(--accent); }
table.types td.act { white-space: nowrap; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 3px transparent; } }

.table-wrap { overflow-x: auto; }
table.types { border-collapse: collapse; font-size: 13px; }
table.types th, table.types td { padding: 4px 4px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.types th { font-weight: 500; font-size: 12px; color: var(--muted); vertical-align: bottom; }
table.types th .sw { display: inline-block; margin-right: 5px; }
table.types input[type=text] { width: 140px; }
table.types input[type=number] { width: 68px; }
table.types select { width: auto; }
table.types .tp-color { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; }
table.types td.pct { font: 12px var(--f-mono); color: var(--muted); padding-right: 12px; }
table.types .ag-ok { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); padding-right: 8px; }
table.types .ag-ok input { accent-color: var(--ink); margin: 0; }
@media (prefers-reduced-motion: reduce) { .flow .fresh, .flash { animation: none; } }
/* Пресеты */
.preset-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.preset-bar select { width: auto; min-width: 220px; max-width: 100%; }
.preset-bar input[type=text] { width: 220px; }

.btn.warn { border-color: var(--hot); color: var(--hot); }
.btn:disabled { opacity: 0.45; cursor: default; }
/* Быстрое переключение пресетов над схемой */
.quick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.quick .q-l { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 2px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { color: var(--ink); border-color: var(--axis); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.pdesc:empty { display: none; }

/* Режим показа: без редактора и без «+» на стрелках; «Настройки» включает их */
body:not(.setup) .edit, body:not(.setup) .setup-only, body:not(.setup) .flow .ins { display: none; }
.flow .bn-p { fill: var(--hot); }
/* Главная цифра — задач в неделю: предел крупно, факт мельче; красная полоса сверху */
.kpi-wrap { display: flex; align-items: flex-end; gap: 32px; flex-wrap: wrap; }

/* Статус участника значками */

</style>
</head>
<body>

  <section class="panel">

<script src="flow.js"></script>
<script>
(function () {
  'use strict';
  const STORE = 'devflow-flow-v2';
  const F = window.DevFlow;
  const clone = o => JSON.parse(JSON.stringify(o));
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = p => p + Math.random().toString(36).slice(2, 7);
  const clip = (s, max) => (s.length > max ? s.slice(0, Math.max(1, max - 1)) + '…' : s);
  const fmtH = h => (+h).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
  const pad = n => String(n).padStart(2, '0');
  const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // Геометрия схемы: ширина узла, отступы, строка исполнителя, размер карточки задачи.
  const G = { NW: 156, TW: 112, GAP: 50, PAD: 4, HEAD: 48, ROW: 24, CW: 30, CH: 16, CG: 5 };
  const FLIGHT_MS = 650;
  const DAY_START = 9; // ноль модели — 9:00 первого дня

  let cfg = load(), st = null, geo = null, fresh = null;
  let playing = true, lastTs = 0, dirty = true, crewEls = [], dialKey = '', fc = null, fcWas = null, velSig = '';
  const flights = [], flightEnd = new Map();
  // Потоки: карточки, которые летят по одной стрелке одновременно, расходятся по полосам — 0, выше, ниже, … до ±3.
  const LANES = [0, -1, 1, -2, 2, -3, 3];
  function laneFor(edge, t0, dur) {
    const busy = new Set(flights.filter(f => f.edge === edge && f.t0 < t0 + dur && t0 < f.t0 + f.dur).map(f => f.lane));
    return LANES.find(l => !busy.has(l)) ?? LANES[flights.length % LANES.length];
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (raw) {
        const c = JSON.parse(raw);
        // Старый сохранённый конфиг приводим к новой схеме: команда и типы задач.
        if (c && c.version === 2 && c.stages && c.stages.length && c.roles && c.roles.length) return F.normalize(c);
      }
    } catch (e) { /* хранилище недоступно */ }
    return clone(F.EXAMPLE);
  }
  function save() {
    storeDraft();
    try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch (e) { /* без сохранения */ }
    renderJson();
  }

  // ---------- Пресеты ----------
  // Пресет — сохранённые настройки. Встроенные — F.PRESETS (ключ '__' + id), свои — { название: настройки }.
  // Правка в редакторе — черновик выбранного пресета: сразу работает в процессе, переживает перезагрузку
  // и переключение пресетов, а в сам пресет попадает по «Сохранить». «Отменить правки» возвращает сохранённое.
  // Сохранённый встроенный пресет лежит поверх исходного, «Вернуть исходный» убирает его.
  const PRESETS = 'devflow-presets-v2', ACTIVE = 'devflow-active-v2', DRAFTS = 'devflow-drafts-v2', BUILTIN = 'devflow-builtin-v2';
  const BI = '__', DEFAULT_KEY = BI + F.PRESETS[0].id;
  let active = DEFAULT_KEY;
  const readObj = key => { try { const v = JSON.parse(localStorage.getItem(key) || '{}'); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; } catch (e) { return {}; } };
  const writeObj = (key, v) => { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const loadPresets = () => readObj(PRESETS);
  const storePresets = p => writeObj(PRESETS, p);
  const builtinOf = key => (String(key).startsWith(BI) ? F.PRESETS.find(b => BI + b.id === key) || null : null);
  const isKnown = key => !!builtinOf(key) || (!String(key).startsWith(BI) && key in loadPresets());
  const presetTitle = key => { const b = builtinOf(key); return b ? b.name : key; };
  const chipLabel = key => { const b = builtinOf(key); return b ? (b.short || b.name) : key; }; // короткая подпись кнопки
  const presetKeys = () => F.PRESETS.map(b => BI + b.id).concat(Object.keys(loadPresets()).filter(k => !k.startsWith(BI)).sort((a, b) => a.localeCompare(b, 'ru')));
  function storeActive() { try { localStorage.setItem(ACTIVE, active); } catch (e) { /* без сохранения */ } }
  function presetMsg(text, err) { const m = $('#presetMsg'); m.textContent = text || ''; m.className = 'msg' + (err ? ' err' : ''); }
  const withoutName = c => { const n = F.normalize(c); delete n.name; return JSON.stringify(n); };
  // Название занято своим или встроенным пресетом; '__' — служебная приставка встроенных.
  const taken = (n, p) => n in p || n.startsWith(BI) || F.PRESETS.some(b => b.name === n);
  function uniqueName(base, p) { let n = base, k = 2; while (taken(n, p)) n = `${base} ${k++}`; return n; }
  const asConfig = (raw, key) => F.fromJSON(JSON.stringify(Object.assign({}, raw, { name: presetTitle(key) })));
  // Сохранённые настройки: свой пресет — из хранилища, встроенный — сохранённый поверх или исходный.
  function savedConfig(key) {
    const b = builtinOf(key), raw = b ? readObj(BUILTIN)[b.id] || b.cfg : loadPresets()[key];
    return raw ? asConfig(raw, key) : null;
  }
  function draftConfig(key) {
    const d = readObj(DRAFTS)[key];
    try { return d ? asConfig(d, key) : null; } catch (e) { return null; }
  }
  const dirtyKeys = () => readObj(DRAFTS);
  function dropDraft(key) { const d = readObj(DRAFTS); delete d[key]; writeObj(DRAFTS, d); }
  // Любая правка — черновик выбранного пресета; совпал с сохранённым — черновика нет.
  function storeDraft() {
    cfg.name = presetTitle(active);
    const d = readObj(DRAFTS);
    let saved = null;
    try { saved = savedConfig(active); } catch (e) { /* испорченный пресет — правки пойдут в черновик */ }
    if (saved && withoutName(saved) === withoutName(cfg)) delete d[active]; else d[active] = clone(cfg);
    if (!writeObj(DRAFTS, d)) presetMsg('Браузер не дал сохранить правки: хранилище недоступно. Скачайте JSON.', true);
    renderPresets();
  }
  function savePreset() {
    if (!(active in dirtyKeys())) return;
    const b = builtinOf(active);
    let ok;
    if (b) {
      const o = readObj(BUILTIN);
      if (withoutName(cfg) === withoutName(b.cfg)) delete o[b.id]; else o[b.id] = clone(cfg);
      ok = writeObj(BUILTIN, o);
    } else { const p = loadPresets(); p[active] = clone(cfg); ok = storePresets(p); }
    if (!ok) { presetMsg('Браузер не дал сохранить пресет: хранилище недоступно. Скачайте JSON.', true); return; }
    dropDraft(active);
    presetMsg(`Пресет «${presetTitle(active)}» сохранён.`);
    renderPresets();
  }
  function revertPreset() {
    let c;
    try { c = savedConfig(active); } catch (e) { presetMsg(`Пресет «${presetTitle(active)}» не читается: ${e.message}.`, true); return; }
    if (!c) return;
    dropDraft(active);
    useConfig(c, 'Правки отменены, процесс продолжается с сохранёнными настройками.', true);
  }
  // Режим показа и режим настройки: редактор под схемой виден только в настройке, выбор запоминается.
  const SETUP = 'devflow-setup-v2';
  const setupOn = () => document.body.classList.contains('setup');
  function setSetup(on) {
    document.body.classList.toggle('setup', on);
    try { localStorage.setItem(SETUP, on ? '1' : '0'); } catch (e) { /* без сохранения */ }
    const b = document.querySelector('#quick [data-act=setup]');
    if (b) b.setAttribute('aria-pressed', String(on));
  }
  try { document.body.classList.toggle('setup', localStorage.getItem(SETUP) === '1'); } catch (e) { /* по умолчанию — показ */ }
  let delArmed = false, delTimer = null;
  function renderPresets() {
    const q = $('#quick');
    if (!q) return;

      ins += `<g class="ins" data-ins="${j + 1}" tabindex="0" role="button" aria-label="${esc(`Вставить этап между «${nameOf(j)}» и «${nameOf(j + 1)}»`)}">
        <title>Вставить этап</title><circle cx="${mx}" cy="${cy}" r="9"/><path d="M${mx - 4},${cy}h8M${mx},${cy - 4}v8"/></g>`;
    }
    // Развилка: часть задач идёт сразу на дальний этап или в «Готово» — точечная дуга с долей.
    routes.forEach(({ i, j, p, h }) => {
      const a = nodes[i], b = nodes[j], sx = a.x + a.w - 24, tx = b.x + 24;
      edges += edgeSvg(`r${i}-${j}`, `M${sx},${y0}C${sx},${y0 - h} ${tx},${y0 - h} ${tx},${y0 - 9}`, `M${tx},${y0}l-4.5,-9h9z`, `${S[i].name}: ${p}% задач сразу в «${nameOf(j)}»`, ' skip');
      // Подпись — у начала пути, над этапом развилки: пути одного этапа стоят столбиком, дальше их пересекают дуги в бэклог.
      edges += `<text class="skip-lbl" x="${sx + 14}" y="${y0 - h + 4}" text-anchor="start">в «${esc(nameOf(j))}» · ${p}%</text>`;
    });
    // Ближние к бэклогу дуги ниже, дальние выше — чтобы не пересекались у бэклога.
    backArcs.sort((a, b) => a.i - b.i).forEach(({ i, key, lbl }, k) => {
      const a = nodes[i], b = nodes[st.bugEntry], h = bugH + 4 * k;
      const sx = a.x + a.w / 2 - 12, tx = b.x + b.w / 2 + 12 + 8 * k;
      edges += edgeSvg(key + i, `M${sx},${y0}C${sx},${y0 - h} ${tx},${y0 - h} ${tx},${y0 - 9}`, `M${tx},${y0}l-4.5,-9h9z`, key === 'bug' ? `${S[i].name} находит баги — они уходят в «${S[st.bugEntry].name}»` : `${S[i].name} заводит техдолг — такие же задачи, они уходят в «${S[st.bugEntry].name}»`, ' bug');
      edges += `<text class="bug-lbl" x="${(sx + tx) / 2}" y="${y0 - h * 0.75 - 4}" text-anchor="middle">${lbl}</text>`;
    });
    nodes.forEach(nd => {
      const { x: nx } = nd;
      if (nd.done) {
        boxes += `<g class="node term"><rect class="n-box" x="${nx}" y="${y0}" width="${nd.w}" height="${NH}" rx="2"/>
          <text class="n-name" x="${nx + 12}" y="${y0 + 21}">Готово</text><g data-dyn="done"></g></g>`;
        return;
      }
      const s = S[nd.i], sub = stageSub(s), rl = s.role ? roleLoad(s.role) : null;
      const lv = rl && rl.load > 0 ? loadLevel(rl.util) : '';
      const ldTitle = lv ? ` · загрузка ${roleName(s.role)} ${pctTxt(rl.util)} — ${loadWord[lv]}${rl.limitBy ? ', упирается в ' + rl.limitBy : ''}` : '';
      boxes += `<g class="node st${s.role ? '' : ' queue'}${lv ? ' lv-' + lv : ''}${s.id === fresh ? ' fresh' : ''}" data-node="${nd.i}" tabindex="0" role="button" aria-label="${esc(s.name)}: открыть в редакторе">
        <title>${esc(s.name)} · ${esc(sub)}${s.role ? ' · ' + esc(stageHours(s)) : ''}${esc(ldTitle)}</title>
        <rect class="n-box" x="${nx}" y="${y0}" width="${G.NW}" height="${NH}" rx="2"/>
        <text class="n-name" x="${nx + 12}" y="${y0 + 21}">${esc(clip(s.name, lv ? 13 : 19))}</text>
        ${lv ? `<rect class="ld-pill" x="${nx + G.NW - 46}" y="${y0 + 9}" width="38" height="16" rx="2"/><text class="ld-t" x="${nx + G.NW - 27}" y="${y0 + 20.5}" text-anchor="middle">${pctTxt(rl.util)}</text>` : ''}
        <text class="n-sub" x="${nx + 12}" y="${y0 + 38}">${esc(clip(sub, 26))}</text>
        ${lv === 'hot' && fc && fc.bottleneck === s.role ? `<rect class="bn-p" x="${nx}" y="${y0 + NH + 4}" width="${G.NW}" height="14"/><text class="bn-t" x="${nx + G.NW / 2}" y="${y0 + NH + 14}" text-anchor="middle">узкое место</text>` : ''}
        <g data-dyn="${nd.i}"></g></g>`;
    });

    $('#flow').innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.round(W * 0.75)}px" role="group" aria-label="Схема процесса">
      <g>${edges}</g><g>${boxes}</g><g>${ins}</g><g class="fly"></g></svg>`;
    const svg = $('#flow svg');
    geo = { nodes, y0, NH, waitTop, dyn: {}, e: {}, fly: svg.querySelector('.fly') };
    svg.querySelectorAll('[data-dyn]').forEach(g => { geo.dyn[g.dataset.dyn] = g; });
    svg.querySelectorAll('[data-e]').forEach(g => { geo.e[g.dataset.e] = { hot: g.querySelector('.e-hot'), path: g.querySelector('.e-base') }; });
    flights.length = 0; flightEnd.clear();
    dirty = true;
    // Новый этап: подсветить стрелки в него и из него.
    const fi = fresh ? S.findIndex(s => s.id === fresh) : -1;
    fresh = null;
    if (fi >= 0) { blink(geo.e['f' + (fi - 1)]); blink(geo.e['f' + fi]); }
  }

  function chipTitle(task) {
    const tp = st.cfg.types[task.type];
    const d = task.domain !== undefined ? task.domain : tp && tp.domain;
    return `#${task.id} · ${tp ? tp.name : ''}${d ? ' · ' + d : ''}${tp && !tp.agents ? ' · только люди' : ''}`;
  }
  // Карточка задачи: заливка — цвет типа (в работе — полная, в ожидании — светлая), рамка — цвет домена.
  // Вид карточки: заливка — цвет домена (у бага и техдолга — домен исходной задачи), на ней размер (S, M, L) или «Bug».
  // Рамка — откуда задача: стори от PM — золотая, баг от QA — красная, техдолг от разработки — фиолетовая.
  // Задача без домена — цвет её типа.
  // Без специализации домены ничего не значат: все карточки одного серого цвета, различаются только рамкой и размером.
  let specialized = true;
  const originOf = task => (task.spawned ? 'debt' : (st.cfg.types[task.type] || {}).bug ? 'bug' : 'story');
  function look(task) {
    const tp = st.cfg.types[task.type], dom = task.domain !== undefined ? task.domain : tp && tp.domain;
    const dc = !specialized && st.cfg.domains.length ? 'var(--neutral)' : dom ? domainColor(dom) : '';
    const origin = originOf(task);
    return { fill: dc || typeColor(tp), ink: dc ? '#000' : inkOn(typeColor(tp)), origin, border: `var(--b-${origin})`, dom: dc, label: tagOf(tp) };
  }
  function chip(x, y, task, filled, w) {
    const k = look(task), tag = esc(k.label), cw = w || G.CW, title = `<title>${esc(chipTitle(task))}</title>`;
    // В работе: заливка домена, цветная рамка и тонкая тёмная линия между ними — рамка видна на любой заливке.
    if (filled) return `<g>${title}<rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${G.CH - 2}" rx="2" style="fill:${k.fill};stroke:${k.border};stroke-width:2"/><rect x="${x + 2.5}" y="${y + 2.5}" width="${cw - 5}" height="${G.CH - 5}" rx="1" style="fill:none;stroke:#000;stroke-width:0.8;opacity:0.6"/><text class="chip-t" x="${x + cw / 2}" y="${y + 11.5}" text-anchor="middle" style="fill:${k.ink}">${tag}</text></g>`;
    return `<g>${title}<rect x="${x + 0.75}" y="${y + 0.75}" width="${cw - 1.5}" height="${G.CH - 1.5}" rx="2" style="fill:${k.fill};fill-opacity:0.35;stroke:${k.border};stroke-width:1.5"/><text class="chip-wt" x="${x + cw / 2}" y="${y + 11.5}" text-anchor="middle">${tag}</text></g>`;
  }
  // Сетка ожидающих задач; не влезло — «+N» в последней ячейке.
  function grid(tasks, x, y, cols, rows, done) {
    const cap = cols * rows, shown = tasks.length > cap ? cap - 1 : tasks.length;
    let h = '';
    for (let k = 0; k < shown; k++) {
      const cx = x + (k % cols) * (G.CW + G.CG), cy = y + Math.floor(k / cols) * (G.CH + G.CG), t = tasks[k];
      h += done
        ? `<g><title>${esc(chipTitle(t))}</title><rect class="chip-d" x="${cx + 0.5}" y="${cy + 0.5}" width="${G.CW - 1}" height="${G.CH - 1}" rx="2" style="stroke:var(--b-${originOf(t)})"/><text class="chip-dt" x="${cx + G.CW / 2}" y="${cy + 11.5}" text-anchor="middle">${esc(tagOf(st.cfg.types[t.type]))}</text></g>`
        : chip(cx, cy, t);
    }
    if (tasks.length > cap) {
      const k = cap - 1, cx = x + (k % cols) * (G.CW + G.CG), cy = y + Math.floor(k / cols) * (G.CH + G.CG);
      h += `<text class="more" x="${cx + G.CW / 2}" y="${cy + 11.5}" text-anchor="middle">+${tasks.length - shown}</text>`;
    }
    return h;
  }

  // Стори в неделю (только от PM, без багов и техдолга): предел по расчёту и факт за последние 2 недели модели.
  function paintKpi() {
    const fact = F.throughput(st);
    // ×N к классической команде — по пределу; у самой классической без правок не показываем.
    const x = baseWeek > 0 ? fc.storiesPerWeek / baseWeek : null;
    const same = x == null || (active === DEFAULT_KEY && Math.abs(x - 1) < 0.005);
    const mult = same ? '' : `<span class="kx" title="Предел относительно «${esc(presetTitle(DEFAULT_KEY))}»: ${fmt1(baseWeek)} задач в неделю">×${x.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}<small>к Classic</small></span>`;
    const html = `<span class="kl">Стори в неделю</span><span class="kn"><b>${fmt1(fc.storiesPerWeek)}</b><small>предел</small>${mult}<span class="kf">факт <b>${fact == null ? '—' : fmt1(fact)}</b></span></span>`;
    if (kpiHtml !== html) { kpiHtml = html; $('#kpi').innerHTML = html; }
  }
  let kpiHtml = '', baseWeek = 0;
  function paint(now) {
    const S = st.cfg.stages, short = F.shortages(st);
    const flying = new Set(flights.filter(f => now < f.t0 + f.dur).map(f => f.task.id));
    S.forEach((s, i) => {
      const x = geo.nodes[i].x, y = geo.y0, c = roleColor(s.role);
      const here = st.tasks.filter(t => t.stage === i);
      const wait = here.filter(t => t.state === 'wait' && !flying.has(t.id));
      let h = '';
      if (s.role) {
        here.filter(t => t.state === 'work').forEach((t, r) => {
          const p = st.people.find(q => q.id === t.person), yy = y + G.HEAD + r * G.ROW, pc = personColor(p);
          const pw = G.NW - 90, prog = t.total ? Math.min(1, 1 - t.left / t.total) : 0;
          const off = !F.isOn(st, p, st.t);
          h += `<g${off ? ' class="off"' : ''}>${p.assist ? `<circle cx="${x + 22}" cy="${yy + 8}" r="11.6" style="fill:none;stroke:var(--assist);stroke-width:1.5"/>` : ''}<circle cx="${x + 22}" cy="${yy + 8}" r="10" style="fill:${pc}"><title>${esc(p.name)}${p.assist ? ` · ИИ-ассистент ×${fmtH(p.speed)}` : ''}${off ? ' · нерабочее время' : ''}</title></circle>
            <text class="av${p.agent ? ' ag' : ''}" x="${x + 22}" y="${yy + 11.2}" text-anchor="middle">${esc(p.label)}</text>
            ${flying.has(t.id) ? '' : chip(x + 38, yy, t, pc, 36)}
            <rect class="pg-bg" x="${x + 80}" y="${yy + 6}" width="${pw}" height="4" rx="2"/>
            <rect x="${x + 80}" y="${yy + 6}" width="${(pw * prog).toFixed(1)}" height="4" rx="2" style="fill:${p.agent ? 'var(--ink)' : pc}"/></g>`; // у агента аватар тёмный — полоска светлая, иначе сливается с дорожкой
        });
        const wy = y + geo.waitTop;
        h += `<text class="n-cnt" x="${x + 12}" y="${wy + 10}">ждут <tspan class="num">${wait.length}</tspan></text>`;
        h += grid(wait, x + 12, wy + 16, 4, 2);
      } else {
        const rows = Math.floor((geo.NH - G.HEAD - 20) / (G.CH + G.CG));
        h += `<text class="n-cnt" x="${x + 12}" y="${y + G.HEAD + 6}">в очереди <tspan class="num">${wait.length}</tspan></text>`;
        h += grid(wait, x + 12, y + G.HEAD + 14, 4, rows);
      }
      // Нехватка домена: красная плашка под этапом, под «узким местом», если оно тоже здесь.
      const sh = short.filter(x => x.stage === i);
      if (sh.length) {
        const rl = roleLoad(s.role), bn = rl && rl.load > 0 && loadLevel(rl.util) === 'hot' && fc.bottleneck === s.role;
        const py = y + geo.NH + 4 + (bn ? 18 : 0), names = sh.map(x => x.domain).join(', ');
        h += `<g><title>${esc(`Ждут ${sh.map(x => `${x.domain}: ${x.waiting}`).join(', ')} — свободные участники роли этот домен не берут`)}</title><rect class="bn-p" x="${x}" y="${py}" width="${G.NW}" height="14"/><text class="bn-t" x="${x + G.NW / 2}" y="${py + 10}" text-anchor="middle">не хватает: ${esc(clip(names, 16))}</text></g>`;
      }
      geo.dyn[i].innerHTML = h;
    });
    paintKpi();
    const dn = geo.nodes[S.length], recent = st.done.slice(-6).reverse();
    geo.dyn.done.innerHTML = `<text class="n-big" x="${dn.x + 12}" y="${geo.y0 + 58}">${st.doneCount}</text>` + grid(recent, dn.x + 12, geo.y0 + 72, 3, 2, true);

    // Летящие карточки задач.
    let fh = '';
    for (let k = flights.length - 1; k >= 0; k--) {
      const f = flights[k], u = (now - f.t0) / f.dur;
      if (u >= 1) { flights.splice(k, 1); continue; }
      if (u < 0) continue;
      if (!f.fired) { f.fired = true; blink(f.edge); }
      const pt = f.edge.path.getPointAtLength(f.edge.len * (1 - (1 - u) * (1 - u)));
      // Полоса расходится к середине пути и сходится к концам: карточка вылетает из этапа и садится в следующий на месте стрелки.
      const dy = (f.lane || 0) * (G.CH + 4) * Math.min(1, 1.6 * Math.sin(Math.PI * u));
      fh += chip(pt.x - 18, pt.y - G.CH / 2 + dy, f.task, f.color, 36);
    }
    geo.fly.innerHTML = fh;

    const human = st.people.find(p => !p.agent);
    // Строка всегда занята — днём «☀ день», — чтобы блок с часами не прыгал при смене дня и ночи.
    const subTxt = human && !F.isOn(st, human, st.t) ? (humansRest() ? '☾ выходной' : '☾ ночь') : '☀ день';
    const clockTxt = clockLabel(st.t);
    if ($('#clock').textContent !== clockTxt) $('#clock').textContent = clockTxt;
    if ($('#clock-sub').innerHTML !== subTxt) $('#clock-sub').innerHTML = subTxt;
    paintDial();
    paintWeek();
    paintMix();
    paintCrew();
    paintVel();
  }

  // ---------- Загрузка ----------
  const loadLevel = u => (u >= 0.95 ? 'hot' : u >= 0.8 ? 'warm' : u >= 0.5 ? 'ok' : 'cold');
  const loadWord = { hot: 'узкое место', warm: 'близко к пределу', ok: 'норма', cold: 'недогружен' };
  const pctTxt = u => `${Math.round(u * 100)}%`;
  const roleLoad = id => (fc ? fc.roles.find(r => r.id === id) : null);
  // Загрузка ролей по расчёту: столбики в панели SP за спринт.
  function renderLoads() {
    const rows = fc.roles.filter(r => r.load > 0).sort((a, b) => b.util - a.util);
    $('#velLoads').innerHTML = '<div class="lh">Загрузка ролей</div>' + rows.map(r => {
      const lv = loadLevel(r.util);
      return `<div class="load-row lv-${lv}" title="${esc(roleName(r.id))}: ${pctTxt(r.util)} — ${loadWord[lv]}${r.limitBy ? ', упирается в ' + esc(r.limitBy) : ''}">
        <span>${esc(roleName(r.id))}${r.limitBy ? ` <small>· ${esc(r.limitBy)}</small>` : ''}</span><span class="ld">${pctTxt(r.util)}</span>
        <span class="bar"><span style="width:${Math.min(100, r.util * 100).toFixed(0)}%"></span></span></div>`;
    }).join('');
  }

  // ---------- Story Points за спринт ----------
  const fmt1 = x => (Number.isFinite(x) ? x.toLocaleString('ru-RU', { maximumFractionDigits: 1 }) : '—');
  function niceMax(v) {
    if (v <= 0) return 10;
    const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  }
  // SP по спринтам: прошедшие и текущий. Оценка после спринта k — среднее прошедших без первого, пока он не единственный.
  function velData() {
    const cur = Math.floor(st.t / F.SPRINT_H);
    const vals = Array.from({ length: cur + 1 }, (_, k) => st.sprints[k] || 0);
    // Оценка после спринта k — среднее за последние 3 прошедших спринта (первый, разгонный, — только пока он один):
    // так оценка догоняет ускорение после изменения команды, а не размазывает его по всей истории.
    const est = vals.slice(0, cur).map((_, k) => { const a = k === 0 ? vals.slice(0, 1) : vals.slice(Math.max(1, k - 2), k + 1); return a.reduce((x, y) => x + y, 0) / a.length; });
    return { cur, vals, est, day: Math.floor((st.t % F.SPRINT_H) / 24) + 1 };
  }
  function paintVel() {
    const d = velData();
    const sig = `${(st.changes || []).length}|${d.vals.join(',')}|${d.day}|${fc && fc.spPerSprint}|${fc && fc.cost.total}|${fcWas}|${st.bugsFound}|${st.cfg.currency}`;
    if (sig === velSig) return;
    velSig = sig;
    const bnRole = fc && fc.bottleneck ? roleLoad(fc.bottleneck) : null;
    const bn = bnRole ? roleName(bnRole.id) + (bnRole.limitBy ? ` (${bnRole.limitBy})` : '') : '—';
    const last = d.est.length ? d.est[d.est.length - 1] : null;
    const was = fcWas != null && Math.abs(fcWas - fc.spPerSprint) > 0.05;
    $('#velStats').innerHTML = `
      <div class="stat main" title="≈ ${fmt1(fc.storiesPerSprint)} стори по ${fmt1(fc.spPerTask)} SP; сверх них ≈ ${fmt1(fc.bugsPerSprint)} багов и ${fmt1(fc.spawnedPerSprint)} задач техдолга — в SP не входят"><span>Расчёт</span><b>${fmt1(fc.spPerSprint)}<small>SP</small></b>
        <small class="bn">узкое место · ${esc(bn)}</small>
        ${was ? `<small class="was">было ${fmt1(fcWas)} · ${fc.spPerSprint >= fcWas ? '+' : '−'}${fmt1(Math.abs(fc.spPerSprint - fcWas))}</small>` : ''}</div>
      <div class="stat" title="Среднее за последние 3 прошедших спринта, без первого разгонного"><span>Факт</span><b>${last == null ? '—' : fmt1(last)}<small>SP</small></b></div>
      <div class="stat"><span>Спринт ${d.cur + 1}</span><b>${fmt1(d.vals[d.cur])}<small>SP · день ${d.day}/14</small></b></div>
      ${costStat(d)}`;
    $('#velChart').innerHTML = velChart(d, was);
    $('#velLegend').innerHTML = '<span><i class="l-bar"></i>SP за спринт</span><span><i class="l-est"></i>оценка по прошедшим спринтам</span><span><i class="l-fc"></i>расчёт</span>' + (was ? '<span><i class="l-was"></i>расчёт до изменения</span>' : '') + ((st.changes || []).length ? '<span><i class="l-chg"></i>изменение настроек</span>' : '');
  }
  // Стоимость: расчёт спринта, цена SP и простой людей; по факту — за прошедшие спринты без первого.
  function costStat(d) {
    const c = fc.cost, cur = esc(st.cfg.currency || '$'), money = v => `${cur}${Math.round(v).toLocaleString('ru-RU')}`;
    if (!(c.total > 0)) return '<div class="stat"><span>Стоимость</span><small>Задайте ставки в команде, чтобы считать цену спринта и SP.</small></div>';
    const from = Math.max(1, d.cur - 3), done = d.vals.slice(from, d.cur), costs = (st.sprintCost || []).slice(from, d.cur);
    const factSP = done.reduce((a, x) => a + x, 0), factCost = costs.reduce((a, x) => a + x, 0);
    const fact = done.length ? `по факту: ${money(factCost / done.length)} за спринт, ${factSP ? money(factCost / factSP) : '—'} за SP` : 'по факту — после второго спринта';
    return `<div class="stat" title="Люди ${money(c.humans)}${c.agents ? `, агенты ${money(c.agents)}` : ''} · простой людей ≈ ${money(c.idle)} · ${fact}"><span>Спринт стоит</span><b>${money(c.total)}<small>${Number.isFinite(c.perSP) ? money(c.perSP) + '/SP' : ''}</small></b></div>`;
  }
  function velChart(d, was) {
    // Ширина в единицах SVG равна ширине блока, чтобы подписи не мельчали на телефоне.
    const W = Math.max(320, Math.min(760, $('#velChart').clientWidth || 640)), H = 200, M = { l: 34, r: 70, t: 14, b: 24 }, pw = W - M.l - M.r, ph = H - M.t - M.b;
    const from = Math.max(0, d.vals.length - 12), slots = Math.max(6, d.vals.length - from), sw = pw / slots;
    const yMax = niceMax(Math.max(...d.vals, ...d.est, fc.spPerSprint, was ? fcWas : 0) * 1.1);
    const X = k => M.l + (k - from + 0.5) * sw, Y = v => M.t + ph - v / yMax * ph;
    let h = '<g class="ax">';
    for (let j = 0; j <= 4; j++) { const v = yMax / 4 * j; h += `<line x1="${M.l}" x2="${M.l + pw}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${M.l - 6}" y="${Y(v) + 3.5}" text-anchor="end">${fmt1(v)}</text>`; }
    for (let k = from; k < from + slots; k++) h += `<text x="${X(k)}" y="${H - 6}" text-anchor="middle">С${k + 1}</text>`;
    h += '</g>';
    d.vals.forEach((v, k) => {
      if (k < from) return;
      const bw = sw * 0.6, cur = k === d.cur;
      h += `<rect class="bar${cur ? ' cur' : ''}" x="${(X(k) - bw / 2).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(M.t + ph - Y(v)).toFixed(1)}" rx="3"><title>Спринт ${k + 1}${cur ? ' (идёт)' : ''}: ${fmt1(v)} SP</title></rect>`;
      if (v > 0) h += `<text class="bar-v" x="${X(k)}" y="${(Y(v) - 4).toFixed(1)}" text-anchor="middle">${fmt1(v)}</text>`;
    });
    // Подпись «было» уводим от подписи расчёта, если линии рядом.
    const yWas = was ? (Math.abs(Y(fcWas) - Y(fc.spPerSprint)) < 13 ? Y(fc.spPerSprint) + (fcWas <= fc.spPerSprint ? 13 : -13) : Y(fcWas)) : 0;
    if (was) h += `<line class="was" x1="${M.l}" x2="${M.l + pw}" y1="${Y(fcWas)}" y2="${Y(fcWas)}"/><text class="was-t" x="${M.l + pw + 6}" y="${yWas + 3.5}">было ${fmt1(fcWas)}</text>`;
    h += `<line class="fc" x1="${M.l}" x2="${M.l + pw}" y1="${Y(fc.spPerSprint)}" y2="${Y(fc.spPerSprint)}"/><text class="fc-t" x="${M.l + pw + 6}" y="${Y(fc.spPerSprint) + 3.5}">расчёт ${fmt1(fc.spPerSprint)}</text>`;
    // Отметки изменений настроек: момент правки в редакторе.
    (st.changes || []).forEach(t => {
      const k = t / F.SPRINT_H;
      if (k < from) return;
      const xc = M.l + (k - from) * sw;
      h += `<line class="chg" x1="${xc.toFixed(1)}" x2="${xc.toFixed(1)}" y1="${M.t}" y2="${M.t + ph}"><title>Изменение настроек: ${clockLabel(t)}</title></line>`;
    });
    const pts = d.est.map((v, k) => [k, v]).filter(([k]) => k >= from);
    if (pts.length) {
      h += `<polyline class="est" points="${pts.map(([k, v]) => `${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}"/>`;
      h += pts.map(([k, v]) => `<circle class="est-d" cx="${X(k).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3"><title>Оценка после спринта ${k + 1}: ${fmt1(v)} SP</title></circle>`).join('');
    }
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Story Points по спринтам, оценка и расчёт">${h}</svg>`;
  }

  // Строка команды: чем занят каждый участник прямо сейчас и сколько этапов сделал.
  function renderCrew() {
    $('#idle').innerHTML = st.people.map((p, i) => `<span class="person" data-p="${i}">
      <span class="av-h${p.assist ? ' assist' : ''}${p.agent ? ' ag' : ''}" style="background:${personColor(p)}"${p.assist ? ` title="ИИ-ассистент ×${fmtH(p.speed)}"` : ''}>${esc(p.label)}</span><span class="pn">${esc(p.name)}</span>
      <span class="ld na" title="Фактическая загрузка: занятая доля рабочего времени">—</span><small class="ps"></small><small class="pd num" title="Сделано этапов"></small></span>`).join('');
    crewEls = [...document.querySelectorAll('#idle [data-p]')].map(el => ({ el, av: el.querySelector('.av-h'), st: el.querySelector('.ps'), done: el.querySelector('.pd'), ld: el.querySelector('.ld') }));
  }
  function paintCrew() {
    st.people.forEach((p, i) => {
      const e = crewEls[i];
      if (!e) return;
      const t = p.task != null ? F.taskById(st, p.task) : null, off = !F.isOn(st, p, st.t);
      // Статус значками: в работе — карточка задачи и полоска прогресса, ☾ — нерабочее время, ⏳ — ждёт работы.
      // Словами — только во всплывающей подсказке.
      let html, tip;
      if (t) {
        const tp = st.cfg.types[t.type], prog = t.total ? Math.min(1, 1 - t.left / t.total) : 0, pct = Math.round(prog * 100);
        const k = look(t);
        html = `<i class="tg" style="background:${k.fill};color:${k.ink};box-shadow:0 0 0 2px ${k.border}">${esc(k.label)}</i><span class="pb"><span style="width:${pct}%"></span></span>${off ? '<span class="ic">☾</span>' : ''}`;
        tip = `${st.cfg.stages[t.stage].name} · ${tp.name} ${pct}%${off ? ' · ждёт утра' : ''}`;
      } else {
        html = `<span class="ic">${off ? '☾' : '⏳'}</span>`;
        tip = p.idleWhy || p.idle || 'свободен';
      }
      if (e.html !== html) { e.html = html; e.st.innerHTML = html; }
      if (e.st.title !== tip) e.st.title = tip;
      const d = `✓ ${p.done}`;
      if (e.done.textContent !== d) e.done.textContent = d;
      e.el.classList.toggle('busy', !!t && !off);
      e.el.classList.toggle('off', off);
      // Фактическая загрузка — после первого рабочего дня, раньше доля ещё ничего не значит.
      if (p.onH >= 8) {
        const u = p.busyH / p.onH, lv = loadLevel(u), cls = `ld lv-${lv}`, txt = pctTxt(u);
        if (e.ld.className !== cls) { e.ld.className = cls; e.ld.title = `Фактическая загрузка: ${txt} рабочего времени занят — ${loadWord[lv]}`; }
        if (e.ld.textContent !== txt) e.ld.textContent = txt;
      }
    });
  }
  // Участник взял задачу — его аватар в строке команды коротко мигает.
  function pulseCrew(personId) {
    const e = crewEls[st.people.findIndex(p => p.id === personId)];
    if (!e || reduceMotion()) return;
    e.av.animate([{ transform: 'scale(1.45)' }, { transform: 'scale(1)' }], { duration: 450, easing: 'ease-out' });
  }

  function blink(e) {
    if (!e) return;
    e.hot.getAnimations().forEach(a => a.cancel());
    e.hot.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, easing: 'ease-out' });
  }

  // Переход задачи — карточка летит по стрелке. Цепочка переходов одной задачи идёт друг за другом.
  function onEvents(ev, now) {
    const S = st.cfg.stages;
    const dur = reduceMotion() ? 0 : FLIGHT_MS;
    const types = new Map();
    ev.forEach(e => { if (e.type === 'new') types.set(e.task, e.kind); if (e.type === 'start') pulseCrew(e.person); });
    ev.forEach(e => {
      // Баг от QA и доработка от разработки летят по своей дуге в бэклог.
      if (e.type === 'new' && (e.bug || e.spawn)) {
        const edge = geo.e[(e.bug ? 'bug' : 'spawn') + e.from];
        if (!edge) return;
        if (!dur) { blink(edge); return; }
        if (edge.len == null) edge.len = edge.path.getTotalLength();
        const t0 = Math.max(now, flightEnd.get(e.task) || 0);
        flights.push({ task: F.taskById(st, e.task) || { id: e.task, type: e.kind, domain: e.domain }, edge, t0, dur, color: true, fired: false, lane: laneFor(edge, t0, dur) });
        flightEnd.set(e.task, t0 + dur);
        return;
      }
      if (e.type !== 'move' && e.type !== 'done') return;
      const edge = e.to > e.from + 1 ? geo.e[`r${e.from}-${e.to}`] : geo.e['f' + e.from]; // через развилку — по её дуге
      if (!edge) return;
      if (!dur) { blink(edge); return; }
      if (edge.len == null) edge.len = edge.path.getTotalLength();
      const task = F.taskById(st, e.task) || (st.done.find(d => d.id === e.task)) || { id: e.task, type: types.get(e.task) || 0 };
      const t0 = Math.max(now, flightEnd.get(e.task) || 0);
      flights.push({ task, edge, t0, dur, color: true, fired: false, lane: laneFor(edge, t0, dur) });
      flightEnd.set(e.task, t0 + dur);
    });
    if (flightEnd.size > 400) flightEnd.clear();
  }

  function loop(ts) {
    const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
    lastTs = ts;
    if (playing && dt > 0) {
      const ev = F.step(st, dt * +$('#speed').value);
      if (ev.length) onEvents(ev, ts);
      dirty = true;
    }
    if (dirty || flights.length) { paint(ts); dirty = false; }
    requestAnimationFrame(loop);
  }

  // keep — продолжить процесс с новыми настройками (правка в редакторе); без него — начать с нуля
  // («Заново», смена пресета).
  function restart(keep) {
    const next = F.forecast(cfg);
    if (fc && Math.abs(fc.spPerSprint - next.spPerSprint) > 0.05) fcWas = fc.spPerSprint;
    fc = next; velSig = '';
    specialized = F.isSpecialized(cfg); mixKey = null; // null, а не '': пустой ключ значит «полоски нет», и её надо стереть
    // База для «×N»: предел сохранённой «Классической команды».
    try { baseWeek = F.forecast(savedConfig(DEFAULT_KEY) || F.EXAMPLE).storiesPerWeek; } catch (e) { baseWeek = F.forecast(F.EXAMPLE).storiesPerWeek; }
    st = keep === true && st ? F.reconfigure(st, cfg) : F.create(cfg);
    renderTypeLegend();
    renderDial();
    renderWeek();
    renderCrew();
    renderFlow();
    renderLoads();
  }
  let timer = null;
  function changed() {
    save();
    clearTimeout(timer);
    timer = setTimeout(() => restart(true), 150);
  }
  // Переименование не перезапускает процесс: обновляем подписи на лету.

    const next = F.create(cfg);
    st.people.forEach(p => { const q = next.people.find(x => x.id === p.id); if (q) { p.name = q.name; p.label = q.label; } });
    renderCrew();
    renderFlow();
    renderLoads();
    renderTypeLegend();
  }
