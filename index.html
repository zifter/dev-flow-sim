        <td><span class="grip" draggable="true" title="Перетащите, чтобы поменять порядок" aria-hidden="true">⠿</span></td>
        <td><input type="color" class="tp-color" id="tp-color-${esc(t.id)}" data-k="color" value="${typeColor(t, cfg.types)}" aria-label="${esc(t.name)}: цвет" title="Цвет карточки на схеме"></td>
        <td><input type="text" id="tp-name-${esc(t.id)}" data-k="name" value="${esc(t.name)}" aria-label="Название типа"></td>
        <td><input type="number" id="tp-w-${esc(t.id)}" data-k="weight" min="0" step="1" value="${t.weight}" aria-label="Доля"></td>
        <td class="pct">${Math.round((+t.weight || 0) / total * 100)}%</td>
        <td><input type="number" id="tp-sp-${esc(t.id)}" data-k="sp" min="0" step="1" value="${t.sp != null ? t.sp : 1}" aria-label="${esc(t.name)}: Story Points"></td>
        <td><select id="tp-dom-${esc(t.id)}" data-k="domain" aria-label="${esc(t.name)}: домен"><option value="">${t.id === F.BUG_ID ? 'как у задачи' : 'любой'}</option>${domainList().map(k => `<option value="${esc(k)}"${t.domain === k ? ' selected' : ''}>${esc(k)}</option>`).join('')}</select></td>
        <td><label class="ag-ok"><input type="checkbox" id="tp-ai-${esc(t.id)}" data-k="agents"${t.agents !== false ? ' checked' : ''} aria-label="ИИ-агенты могут делать ${esc(t.name)}">можно</label></td>
        <td><input type="number" id="tp-bc-${esc(t.id)}" data-k="bugChance" min="0" max="95" step="5" value="${t.bugChance || 0}" aria-label="${esc(t.name)}: доля задач с багом, %"></td>
        ${S.map(s => `<td><input type="number" id="tp-h-${esc(t.id)}-${esc(s.id)}" data-k="h:${esc(s.id)}" min="0" step="0.5" value="${t.hours && t.hours[s.id] != null ? t.hours[s.id] : 1}" aria-label="${esc(t.name)}: ${esc(s.name)}, часов"></td>`).join('')}
        <td class="act">
          <button class="icon-btn" type="button" data-act="up" title="Выше" aria-label="Выше"${i === 0 ? ' disabled' : ''}>↑</button>
          <button class="icon-btn" type="button" data-act="down" title="Ниже" aria-label="Ниже"${i === n - 1 ? ' disabled' : ''}>↓</button>
          <button class="icon-btn" type="button" data-act="del" title="${t.id === F.BUG_ID ? 'Bug — обязательный тип, все найденные баги этого типа' : 'Удалить тип'}" aria-label="Удалить тип"${n < 2 || t.id === F.BUG_ID ? ' disabled' : ''}>✕</button>
        </td>
      </tr>`).join('')}</tbody></table>`;
  }

  // Скорость анимации — настройка экрана, а не пресета: одна на все пресеты, хранится в браузере отдельно.
  const SPEED = 'devflow-speed-v2';
  function syncSpeed() {
    let v = '4';
    try { v = localStorage.getItem(SPEED) || '4'; } catch (e) { /* по умолчанию 4 ч/с */ }
    const sel = $('#speed');
    sel.value = [...sel.options].some(o => o.value === v) ? v : '4';
  }
  function renderEditor() { renderTeam(); renderRoles(); renderDomains(); renderStages(); renderTypes(); syncSpeed(); }

  // Первый этап — источник задач, ему нужен исполнитель.
  function fixFirst() { const s = cfg.stages[0]; if (s && !s.role) s.role = cfg.roles[0].id; }

  function insertStage(pos) {
    const prev = cfg.stages[pos - 1];
    const s = { id: uid('s'), name: 'Новый этап', role: (prev && prev.role) || cfg.roles[0].id };
    cfg.stages.splice(pos, 0, s);
    cfg.types.forEach(t => { t.hours = t.hours || {}; t.hours[s.id] = 1; });
    fresh = s.id;
    renderStages(); renderTypes();
    changed();
    focusRow(`#stages [data-stage="${pos}"]`, true);
  }
  // field — какое поле строки получит фокус (по умолчанию название).
  function focusRow(sel, select, field) {
    const row = document.querySelector(sel);
    if (!row) return;
    row.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    const inp = (field && row.querySelector(`[data-k="${field}"]`)) || row.querySelector('[data-k="name"]');
    inp.focus({ preventScroll: true });
    if (select) inp.select();
  }

  // Команда
  $('#currency').addEventListener('input', e => { cfg.currency = e.target.value.trim().slice(0, 4) || '$'; renderTeam(); renderRoles(); changed(); });
  $('#assistSpeed').addEventListener('input', e => { const v = parseFloat(e.target.value); if (!Number.isFinite(v) || v <= 0) return; cfg.assistSpeed = Math.min(5, Math.max(0.5, v)); renderTeam(); changed(); });
  $('#agentRate').addEventListener('input', e => { const v = parseFloat(e.target.value); if (!Number.isFinite(v) || v < 0) return; cfg.agentRate = v; renderTeam(); changed(); });
  ['humanHours', 'agentHours', 'humanDays', 'agentDays'].forEach(id => $('#' + id).addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    if (!Number.isFinite(v)) return;
    cfg[id] = id.endsWith('Days') ? Math.min(7, Math.max(1, Math.round(v))) : Math.min(24, Math.max(1, v));
    changed();
  }));
  function onTeamEdit(e) {
    const el = e.target, row = el.closest('[data-member]');
    if (!row || !el.dataset.k) return;
    const m = cfg.team[+row.dataset.member], k = el.dataset.k;
    if (k === 'name') { m.name = el.value; renamed(); const av = row.querySelector('.av-h'), p = F.create(cfg).people.find(x => x.id === m.id); if (av && p) av.textContent = p.label; return; }
    if (k === 'speed') { const v = parseFloat(el.value); if (!Number.isFinite(v) || v <= 0) return; m.speed = v; changed(); return; }
    // Пустое поле или 0 — ставка роли (у агента — ставка агента по умолчанию).
    if (k === 'rate') { const v = parseFloat(el.value); if (el.value.trim() === '' || v === 0) delete m.rate; else if (Number.isFinite(v) && v > 0) m.rate = v; else return; changed(); return; }
    // ИИ-ассистент у человека: работает в assistSpeed раз быстрее.
    if (k === 'assist') { if (el.checked) m.assist = true; else delete m.assist; renderTeam(); changed(); return; }
    // Отключённый остаётся в настройках, но не работает и не входит в расчёт.
    if (k === 'active') {
      if (el.checked) delete m.active; else m.active = false;
      renderTeam(); renderRoles(); renderDomains(); changed(); return;
    }
    // «все» — поле domains убирается: участник берёт задачи любых доменов, и будущих тоже.
    if (k === 'dom-all') {
      if (el.checked) delete m.domains; else m.domains = domainList().slice();
      renderTeam(); renderDomains(); changed(); return;
    }
    if (k.startsWith('dom:')) {
      const d = k.slice(4), own = new Set(Array.isArray(m.domains) ? m.domains : domainList());
      if (el.checked) own.add(d); else own.delete(d);
      m.domains = domainList().filter(x => own.has(x));
      renderDomains(); changed(); return;
    }
    m[k] = el.value;
    if (k === 'kind' && m.kind === 'agent' && !m.speed) m.speed = 5;
    if (k === 'kind' && m.kind === 'agent') delete m.assist;
    renderTeam(); renderRoles(); changed();
  }
  $('#team').addEventListener('input', e => { if (e.target.tagName !== 'SELECT') onTeamEdit(e); });
  $('#team').addEventListener('change', e => { if (e.target.tagName === 'SELECT') onTeamEdit(e); });
  $('#team').addEventListener('click', e => {
    const b = e.target.closest('[data-act=del]'), row = e.target.closest('[data-member]');
    if (!b || !row) return;
    cfg.team.splice(+row.dataset.member, 1);
    renderTeam(); renderRoles(); changed();
  });
  function addMember(kind) {
    const role = cfg.roles.find(r => r.id === 'dev') || cfg.roles[0];
    const same = cfg.team.filter(m => m.role === role.id && m.kind === kind).length + 1;
    const name = kind === 'agent' ? `ИИ-${role.name.toLowerCase()}${same > 1 ? ' ' + same : ''}` : `${role.name} ${same}`;
    cfg.team.push(Object.assign({ id: uid('m'), name, role: role.id, kind }, kind === 'agent' ? { speed: 5 } : {})); // ставка — по роли
    renderTeam(); renderRoles(); changed();
    focusRow('#team .m-row:last-child', true);
  }
  $('#addHuman').addEventListener('click', () => addMember('human'));
  $('#addAgent').addEventListener('click', () => addMember('agent'));

  // Роли
  $('#roles').addEventListener('input', e => {
    const el = e.target, row = el.closest('[data-role]');
    if (!row || !el.dataset.k) return;
    const r = cfg.roles[+row.dataset.role], k = el.dataset.k;
    // «все типы» — и будущие тоже; иначе явный список id.
    if (k === 'cr-all' || k.startsWith('cr:')) {
      const now = F.normalize(cfg).roles[+row.dataset.role].creates;
      if (k === 'cr-all') r.creates = el.checked ? 'all' : cfg.types.map(t => t.id);
      else {
        const set = new Set(now === 'all' ? cfg.types.map(t => t.id) : now), id = k.slice(3);
        if (el.checked) set.add(id); else set.delete(id);
        r.creates = cfg.types.map(t => t.id).filter(x => set.has(x));
      }
      openCreates = +row.dataset.role;
      renderRoles(); changed(); return;
    }
    if (el.dataset.k === 'rate') {
      const v = parseFloat(el.value);
      if (el.value.trim() === '' || v === 0) delete r.rate; else if (Number.isFinite(v) && v > 0) r.rate = v; else return;
      renderTeam(); changed(); return;
    }
    r.name = el.value;
    renderTeam(); renderStages(); renamed();
  });
  $('#roles').addEventListener('toggle', e => { const d = e.target.closest && e.target.closest('[data-cr]'); if (d) openCreates = d.open ? +d.dataset.cr : (openCreates === +d.dataset.cr ? -1 : openCreates); }, true);
  $('#roles').addEventListener('click', e => {
    const b = e.target.closest('[data-act=del]'), row = e.target.closest('[data-role]');
    if (!b || !row || cfg.roles.length < 2) return;
    const [gone] = cfg.roles.splice(+row.dataset.role, 1);
    const to = cfg.roles[0].id;
    cfg.stages.forEach(s => { if (s.role === gone.id) s.role = to; });
    cfg.team.forEach(m => { if (m.role === gone.id) m.role = to; });
    renderEditor(); changed();
  });
  // Домены: переименование меняет ссылки у участников и типов, удаление их снимает.
  $('#domains').addEventListener('input', e => {
    const el = e.target, row = el.closest('[data-domain]');
    if (!row || el.dataset.k !== 'name') return;
    const i = +row.dataset.domain, old = cfg.domains[i], name = el.value.trim();
    if (!name || (name !== old && cfg.domains.includes(name))) return;
    cfg.domains[i] = name;
    cfg.team.forEach(m => { if (Array.isArray(m.domains)) m.domains = m.domains.map(d => (d === old ? name : d)); });
    cfg.types.forEach(t => { if (t.domain === old) t.domain = name; });
    renderTeam(); renderTypes(); changed();
  });
  $('#domains').addEventListener('click', e => {
    const b = e.target.closest('[data-act=del]'), row = e.target.closest('[data-domain]');
    if (!b || !row) return;
    const [gone] = cfg.domains.splice(+row.dataset.domain, 1);
    cfg.team.forEach(m => { if (Array.isArray(m.domains)) m.domains = m.domains.filter(d => d !== gone); });
    cfg.types.forEach(t => { if (t.domain === gone) t.domain = null; });
    renderEditor(); changed();
  });
  $('#addDomain').addEventListener('click', () => {
    cfg.domains = cfg.domains || [];
    let name = 'Новый домен', k = 2;
    while (cfg.domains.includes(name)) name = `Новый домен ${k++}`;
    cfg.domains.push(name);
    renderEditor(); changed();
    focusRow('#domains .r-row:last-child', true);
  });
  $('#addRole').addEventListener('click', () => {
    cfg.roles.push({ id: uid('r'), name: 'Новая роль' });
    renderEditor(); changed();
    focusRow('#roles .r-row:last-child', true);
  });

  // Этапы
  function onStageEdit(e) {
    const el = e.target, row = el.closest('[data-stage]');
    if (!row || !el.dataset.k) return;
    const s = cfg.stages[+row.dataset.stage], k = el.dataset.k;
    if (k === 'name') { s.name = el.value; renderTypes(); renamed(); return; }
    if (k === 'bugs') { if (el.checked) s.bugs = true; else delete s.bugs; changed(); return; }
    if (k === 'role') {
      if (el.value) s.role = el.value; else { s.role = null; s.limit = s.limit || 0; }
      renderStages(); renderTypes(); changed(); return;
    }
    const v = parseFloat(el.value);
    if (!Number.isFinite(v)) return;
    s[k] = Math.max(0, v);
    changed();
  }
  $('#stages').addEventListener('input', e => { if (e.target.tagName !== 'SELECT') onStageEdit(e); });
  $('#stages').addEventListener('change', e => { if (e.target.tagName === 'SELECT') onStageEdit(e); });
  $('#stages').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'), row = e.target.closest('[data-stage]');
    if (!b || !row) return;
    const i = +row.dataset.stage, S = cfg.stages;
    if (b.dataset.act === 'up' && i > 0) [S[i - 1], S[i]] = [S[i], S[i - 1]];
    if (b.dataset.act === 'down' && i < S.length - 1) [S[i + 1], S[i]] = [S[i], S[i + 1]];
    if (b.dataset.act === 'del' && S.length > 1) S.splice(i, 1);
    fixFirst();
    renderStages(); renderTypes(); changed();
    if (b.dataset.act !== 'del') focusMoved('#stages', 'stage', b.dataset.act === 'up' ? Math.max(0, i - 1) : Math.min(S.length - 1, i + 1), b.dataset.act);
  });
  $('#addStage').addEventListener('click', () => insertStage(cfg.stages.length));

  // Типы задач
  $('#types').addEventListener('input', e => {
    const el = e.target, row = el.closest('[data-type]');
    if (!row || !el.dataset.k) return;
    const t = cfg.types[+row.dataset.type], k = el.dataset.k;
    if (k === 'name') { t.name = el.value; renamed(); renderRoles(); return; }
    // Цвет меняется на лету, без перезапуска процесса.
    if (k === 'color') {
      t.color = el.value;
      const live = st.cfg.types[+row.dataset.type]; if (live) live.color = el.value;
      save(); renderTypeLegend(); dirty = true; return;
    }
    if (k === 'agents') { t.agents = el.checked; changed(); return; }
    if (k === 'domain') { t.domain = el.value || null; renderDomains(); changed(); return; }
    if (k === 'bugChance') { const v = parseFloat(el.value); if (!Number.isFinite(v) || v < 0) return; t.bugChance = Math.min(95, v); changed(); return; }
    const v = parseFloat(el.value);
    if (!Number.isFinite(v) || v < 0) return;
    if (k === 'weight') {
      t.weight = v;
      const total = cfg.types.reduce((a, x) => a + (+x.weight || 0), 0) || 1;
      document.querySelectorAll('#types [data-type]').forEach((r, j) => { r.querySelector('.pct').textContent = Math.round((+cfg.types[j].weight || 0) / total * 100) + '%'; });
    } else if (k === 'sp') t.sp = v;
    else { t.hours = t.hours || {}; t.hours[k.slice(2)] = v; }
    changed();
  });
  $('#types').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'), row = e.target.closest('[data-type]');
    if (!b || !row) return;
    const i = +row.dataset.type, T = cfg.types;
    if (b.dataset.act === 'del') {
      if (T.length < 2 || T[i].id === F.BUG_ID) return; // Bug удалить нельзя
      const [gone] = T.splice(i, 1);
      cfg.roles.forEach(r => { if (Array.isArray(r.creates)) r.creates = r.creates.filter(x => x !== gone.id); });
      renderRoles();
      renderTypes(); changed(); return;
    }
    const j = b.dataset.act === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= T.length) return;
    [T[i], T[j]] = [T[j], T[i]];
    renderTypes(); changed();
    focusMoved('#types', 'type', j, b.dataset.act);
  });
  $('#addType').addEventListener('click', () => {
    const base = cfg.types[0] || { hours: {} };
    cfg.types.push({ id: uid('t'), name: 'Новый тип', weight: 1, hours: clone(base.hours || {}) });
    renderTypes(); changed();
    focusRow('#types tbody tr:last-child', true);
  });

  // После ↑/↓ — подсветить строку на новом месте и вернуть фокус на ту же кнопку.
  function focusMoved(box, attr, i, act) {
    const row = document.querySelector(`${box} [data-${attr}="${i}"]`);
    if (!row) return;
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    const btn = row.querySelector(`[data-act="${act}"]`);
    (btn && !btn.disabled ? btn : row.querySelector('[data-k="name"]')).focus({ preventScroll: true });
  }
  // Перетаскивание строк: тянем за ⠿, синяя линия показывает место, отпускаем — строка встаёт туда.
  function sortable(box, attr, list, done) {
    let from = null;
    const rowOf = e => e.target.closest(`[data-${attr}]`);
    const clear = () => box.querySelectorAll('.drop-before, .drop-after').forEach(r => r.classList.remove('drop-before', 'drop-after'));
    const place = (e, row) => { const r = row.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; };
    const stop = () => { from = null; clear(); box.querySelectorAll('.dragging').forEach(r => r.classList.remove('dragging')); };
    box.addEventListener('dragstart', e => {
      const row = e.target.closest('.grip') && rowOf(e);
      if (!row) return;
      from = +row.dataset[attr];
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(from));
      if (e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(row, 16, 16);
    });
    box.addEventListener('dragover', e => {
      const row = from != null && rowOf(e);
      if (!row) return;
      e.preventDefault();
      clear();
      row.classList.add(place(e, row) ? 'drop-before' : 'drop-after');
    });
    box.addEventListener('drop', e => {
      const row = from != null && rowOf(e);
      if (row) {
        e.preventDefault();
        const arr = list();
        let to = +row.dataset[attr] + (place(e, row) ? 0 : 1);
        if (to > from) to--;
        if (to !== from) {
          const [item] = arr.splice(from, 1);
          arr.splice(to, 0, item);
          stop(); done(to); return;
        }
      }
      stop();
    });
    box.addEventListener('dragend', stop);
  }
  sortable($('#stages'), 'stage', () => cfg.stages, to => {
    fixFirst(); renderStages(); renderTypes(); changed();
    const row = document.querySelector(`#stages [data-stage="${to}"]`); if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
  });
  sortable($('#team'), 'member', () => cfg.team, to => {
    renderTeam(); changed();
    const row = document.querySelector(`#team [data-member="${to}"]`); if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
  });
  sortable($('#types'), 'type', () => cfg.types, to => {
    renderTypes(); changed();
    const row = document.querySelector(`#types [data-type="${to}"]`); if (row) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
  });

  // Схема и управление
  function onFlowAct(e) {
    const ins = e.target.closest('[data-ins]');
    if (ins) { insertStage(+ins.dataset.ins); return; }
    const nd = e.target.closest('[data-node]');
    // Клик по очереди — сразу в её WIP-лимит, по этапу с ролью — в название.
    if (nd) { setSetup(true); const q = !st.cfg.stages[+nd.dataset.node].role; focusRow(`#stages [data-stage="${nd.dataset.node}"]`, q, q ? 'limit' : null); }
  }
  $('#flow').addEventListener('click', onFlowAct);
  $('#flow').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onFlowAct(e); } });
  $('#play').addEventListener('click', () => {
    playing = !playing;
    $('#play').textContent = playing ? '❚❚ Пауза' : '▶ Пуск';
  });
  $('#restart').addEventListener('click', () => restart());
  $('#speed').addEventListener('change', e => { try { localStorage.setItem(SPEED, e.target.value); } catch (err) { /* без сохранения */ } });
  window.addEventListener('resize', () => { velSig = ''; dirty = true; });

  // Пресеты и JSON
  // Кнопки пресетов — над схемой, действия с ними — в панели «Пресеты»; обработчик один.
  const onPresetClick = e => {
    const chip = e.target.closest('[data-key]'), act = e.target.closest('[data-act]');
    if (chip) { if (chip.dataset.key !== active) switchTo(chip.dataset.key); return; }
    if (act && act.dataset.act === 'save') savePreset();
    if (act && act.dataset.act === 'revert') revertPreset();
    if (act && act.dataset.act === 'setup') setSetup(!setupOn());
    if (act && act.dataset.act === 'unspec') { cfg = F.unspecialize(cfg); presetMsg('Специализация убрана: те же люди берут задачи всех доменов.'); renderEditor(); changed(); }
  };
  $('#quick').addEventListener('click', onPresetClick);
  $('#presetActs').addEventListener('click', onPresetClick);
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); savePreset(); }
  });
  // Описание — часть настроек пресета: правка идёт в черновик, «Сохранить» записывает.
  $('#presetDesc').addEventListener('input', e => { const v = e.target.value.replace(/\s+/g, ' ').trim(); if (v) cfg.description = v.slice(0, 160); else delete cfg.description; save(); });
  $('#presetRename').addEventListener('click', () => {
    const name = $('#presetName').value.trim(), p = loadPresets(), old = active;
    if (builtinOf(old) || !name || name === old) return;
    if (taken(name, p)) { presetMsg(`Название «${name}» уже занято, выберите другое.`, true); return; }
    p[name] = Object.assign({}, p[old], { name }); delete p[old]; storePresets(p);
    const d = readObj(DRAFTS);
    if (old in d) { d[name] = d[old]; delete d[old]; writeObj(DRAFTS, d); }
    active = name; storeActive();
    save();
    presetMsg(`Пресет «${old}» переименован в «${name}».`);
  });
  // Копия — новый свой пресет из текущих настроек вместе с правками; у исходного правки снимаются.
  $('#presetCopy').addEventListener('click', () => {
    const p = loadPresets(), typed = $('#presetName').value.trim(), from = active;
    const name = uniqueName(typed && typed !== presetTitle(from) ? typed : `${presetTitle(from)} — копия`, p);
    cfg.name = name; p[name] = clone(cfg);
    if (!storePresets(p)) { presetMsg('Браузер не дал сохранить пресет: хранилище недоступно. Скачайте JSON.', true); return; }
    dropDraft(from);
    active = name; storeActive();
    $('#presetName').blur();
    save();
    presetMsg(`Создан пресет «${name}», он выбран.`);
  });
  // Удаление своего пресета и возврат встроенного к исходному — в два нажатия: первое спрашивает, второе делает.
  $('#presetDel').addEventListener('click', () => {
    const b = builtinOf(active), btn = $('#presetDel');
    if (!delArmed) {
      delArmed = true; btn.textContent = b ? 'Точно вернуть?' : 'Точно удалить?'; btn.classList.add('warn');
      clearTimeout(delTimer); delTimer = setTimeout(() => { delArmed = false; btn.classList.remove('warn'); renderPresets(); }, 3000);
      return;
    }
    delArmed = false; clearTimeout(delTimer); btn.classList.remove('warn');
    const key = active;
    dropDraft(key);
    if (b) {
      const o = readObj(BUILTIN); delete o[b.id]; writeObj(BUILTIN, o);
      switchTo(key, `Пресет «${b.name}» возвращён к исходному.`);
    } else {
      const p = loadPresets(); delete p[key]; storePresets(p);
      switchTo(DEFAULT_KEY, `Пресет «${key}» удалён, загружен «${presetTitle(DEFAULT_KEY)}».`);
    }
  });
  $('#jsonDownload').addEventListener('click', () => {
    const name = cfg.name || 'настройки';
    const slug = name.toLowerCase().replace(/[^a-zа-яё0-9]+/gi, '-').replace(/^-|-$/g, '') || 'devflow';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2) + '\n'], { type: 'application/json' }));
    a.download = `devflow-${slug}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    presetMsg(`Скачан файл ${a.download}.`);
  });
  $('#jsonFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    f.text().then(text => {
      const next = F.fromJSON(text), p = loadPresets();
      active = uniqueName(next.name === 'Без названия' ? f.name.replace(/\.json$/i, '') : next.name, p);
      next.name = active; p[active] = clone(next); storePresets(p);
      storeActive();
      useConfig(next, `Открыт файл ${f.name}, он сохранён как пресет «${active}».`);    }).catch(err => presetMsg(`Файл ${f.name} не подошёл: ${err.message}.`, true));
  });
  $('#jsonApply').addEventListener('click', () => {
    try { $('#jsonText').blur(); useConfig(F.fromJSON($('#jsonText').value), 'JSON применён, процесс продолжается с новыми настройками. «Сохранить» запишет их в пресет.', true); }
    catch (err) { presetMsg(`JSON не применён: ${err.message}.`, true); }
  });
  $('#jsonCopy').addEventListener('click', () => {
    const ta = $('#jsonText');
    navigator.clipboard.writeText(ta.value).then(() => presetMsg('JSON скопирован.')).catch(() => { ta.select(); presetMsg('Текст выделен, скопируйте его вручную.'); });
  });

  renderEditor();
  renderPresets();
  renderJson();
  restart();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
